  /api/admin/categories:
    post:
      operationId: api_55
      summary: Add a category
      tags:
      - Administrator
      description: 'API-55. Requirements: FR-26. Use cases: UC-23. Access: Administrator. Validation: name 1-60
        chars, unique ignoring case.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 60
              required:
              - name
      security:
      - sessionCookie: []
        csrfToken: []
      responses:
        '201':
          description: Created category
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '400':
          description: 'VALIDATION_ERROR: Request body, query or path parameter fails validation'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: 'CATEGORY_EXISTS: Name already used (case-insensitive)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: 'UNAUTHENTICATED: no valid session'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: 'FORBIDDEN: role not allowed, or CSRF_INVALID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/admin/categories/{categoryId}:
    patch:
      operationId: api_56
      summary: Rename a category
      tags:
      - Administrator
      description: 'API-56. Requirements: FR-26. Use cases: UC-23. Access: Administrator. Validation: name 1-60
        chars, unique ignoring case.'
      parameters:
      - name: categoryId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/ObjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 60
              required:
              - name
      security:
      - sessionCookie: []
        csrfToken: []
      responses:
        '200':
          description: Renamed category
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '400':
          description: 'VALIDATION_ERROR: Request body, query or path parameter fails validation'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 'NOT_FOUND: Resource does not exist or is not visible to the caller'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: 'CATEGORY_EXISTS: Name already used (case-insensitive)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: 'UNAUTHENTICATED: no valid session'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: 'FORBIDDEN: role not allowed, or CSRF_INVALID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      operationId: api_57
      summary: Delete a category
      tags:
      - Administrator
      description: 'API-57. Requirements: FR-26. Use cases: UC-23. Access: Administrator. Validation: category must
        have no books.'
      parameters:
      - name: categoryId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/ObjectId'
      security:
      - sessionCookie: []
        csrfToken: []
      responses:
        '204':
          description: No content
        '404':
          description: 'NOT_FOUND: Resource does not exist or is not visible to the caller'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: 'CATEGORY_IN_USE: Books still reference the category'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: 'UNAUTHENTICATED: no valid session'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: 'FORBIDDEN: role not allowed, or CSRF_INVALID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/admin/reviews:
    get:
      operationId: api_58
      summary: List reviews for moderation
      tags:
      - Administrator
      description: 'API-58. Requirements: FR-27. Use cases: UC-22. Access: Administrator. Validation: page >= 1;
        bookId valid id.'
      parameters:
      - name: bookId
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/ObjectId'
      - name: maxRating
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 5
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
      security:
      - sessionCookie: []
      responses:
        '200':
          description: All reviews for moderation, newest first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewPage'
        '400':
          description: 'VALIDATION_ERROR: Request body, query or path parameter fails validation'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: 'UNAUTHENTICATED: no valid session'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: 'FORBIDDEN: role not allowed, or CSRF_INVALID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/admin/reviews/{reviewId}:
    delete:
      operationId: api_59
      summary: Remove a review
      tags:
      - Administrator
      description: 'API-59. Requirements: FR-27. Use cases: UC-22. Access: Administrator. Validation: reviewId valid.'
      parameters:
      - name: reviewId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/ObjectId'
      security:
      - sessionCookie: []
        csrfToken: []
      responses:
        '204':
          description: No content; book average rating recalculated
        '404':
          description: 'NOT_FOUND: Resource does not exist or is not visible to the caller'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: 'UNAUTHENTICATED: no valid session'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: 'FORBIDDEN: role not allowed, or CSRF_INVALID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/admin/reports/platform:
    get:
      operationId: api_60
      summary: Platform report for a date range
      tags:
      - Administrator
      description: 'API-60. Requirements: FR-28. Use cases: UC-24. Access: Administrator. Validation: from and to
        are ISO dates; from <= to; range <= 366 days.'
      parameters:
      - name: from
        in: query
        required: true
        schema:
          type: string
          format: date
      - name: to
        in: query
        required: true
        schema:
          type: string
          format: date
      security:
      - sessionCookie: []
      responses:
        '200':
          description: '{ from, to, orderCount, revenue, topBooks[10] }'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformReport'
        '400':
          description: 'VALIDATION_ERROR: Request body, query or path parameter fails validation; INVALID_DATE_RANGE:
            from after to, or range longer than 366 days'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: 'UNAUTHENTICATED: no valid session'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: 'FORBIDDEN: role not allowed, or CSRF_INVALID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/health:
    get:
      operationId: api_61
      summary: Health check used by the uptime monitor
      tags:
      - System
      description: 'API-61. Requirements: VFR-09. Use cases: UC-01 to UC-25 (system-wide). Access: None. Validation:
        None.'
      security: []
      responses:
        '200':
          description: '{ status: ok, db: up, uptimeSeconds, time }; 503 with db: down when the database does not
            answer'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          description: 'UNHEALTHY: Database check failed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  schemas:
    ObjectId:
      type: string
      pattern: ^[a-f0-9]{24}$
      example: 65a1f0c2b4d3e8a9c1d2e3f4
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: array
              items:
                type: object
                properties:
                  field:
                    type: string
                  issue:
                    type: string
          required:
          - code
          - message
      required:
      - error
    Message:
      type: object
      properties:
        message:
          type: string
      required:
      - message
    CsrfToken:
      type: object
      properties:
        csrfToken:
          type: string
      required:
      - csrfToken
    AddressInput:
      type: object
      properties:
        fullName:
          type: string
        line1:
          type: string
        line2:
          type: string
        city:
          type: string
        state:
          type: string
        postalCode:
          type: string
        country:
          type: string
        phone:
          type: string
      required:
      - fullName
      - line1
      - city
      - state
      - postalCode
      - country
      - phone
    Address:
      allOf:
      - $ref: '#/components/schemas/AddressInput'
      - type: object
        properties:
          id:
            $ref: '#/components/schemas/ObjectId'
          label:
            type: string
          isDefault:
            type: boolean
    User:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/ObjectId'
        name:
          type: string
        email:
          type: string
          format: email
        roles:
          type: array
          items:
            type: string
            enum:
            - customer
            - seller
            - admin
        status:
          type: string
          enum:
          - pending_verification
          - active
          - suspended
      required:
      - id
      - name
      - email
      - roles
      - status
    Profile:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        addresses:
          type: array
          maxItems: 5
          items:
            $ref: '#/components/schemas/Address'
    Category:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/ObjectId'
        name:
          type: string
      required:
      - id
      - name
    CategoryList:
      type: array
      items:
        $ref: '#/components/schemas/Category'
    Book:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/ObjectId'
        sellerId:
          $ref: '#/components/schemas/ObjectId'
        title:
          type: string
        author:
          type: string
        isbn:
          type: string
        price: &id001
          type: integer
          description: Amount in minor currency units
        description:
          type: string
        categoryId:
          $ref: '#/components/schemas/ObjectId'
        language:
          type: string
        imageUrls:
          type: array
          items:
            type: string
        stock:
          type: integer
          minimum: 0
        stockStatus:
          type: string
          enum:
          - In stock
          - Out of stock
        status:
          type: string
          enum:
          - pending
          - approved
          - rejected
          - removed
        avgRating:
          type: number
        reviewCount:
          type: integer
      required:
      - id
      - title
      - author
      - isbn
      - price
      - stockStatus
      - avgRating
    Page:
      type: object
      properties:
        page:
          type: integer
        pageSize:
          type: integer
        totalItems:
          type: integer
        totalPages:
          type: integer
    Review:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/ObjectId'
        bookId:
          $ref: '#/components/schemas/ObjectId'
        userName:
          type: string
        rating:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
      - id
      - rating
    Summary:
      type: object
      properties:
        subtotal: *id001
        tax: *id001
        shippingFee: *id001
        total: *id001
      required:
      - subtotal
      - tax
      - shippingFee
      - total
    CartItem:
      type: object
      properties:
        bookId:
          $ref: '#/components/schemas/ObjectId'
        title:
          type: string
        unitPrice: *id001
        quantity:
          type: integer
        available:
          type: boolean
        lineTotal: *id001
    Cart:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CartItem'
        summary:
          $ref: '#/components/schemas/Summary'
      required:
      - items
      - summary
    Wishlist:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Book'
    OrderItem:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/ObjectId'
        bookId:
          $ref: '#/components/schemas/ObjectId'
        title:
          type: string
        isbn:
          type: string
        unitPrice: *id001
        quantity:
          type: integer
        lineTotal: *id001
        fulfilmentStatus:
          type: string
          enum:
          - Placed
          - Packed
          - Shipped
          - Delivered
          - Cancelled
    Order:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/ObjectId'
        orderNumber:
          type: string
        status:
          type: string
          enum:
          - PendingPayment
          - PaymentFailed
          - Placed
          - Packed
          - Shipped
          - Delivered
          - Cancelled
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
        summary:
          $ref: '#/components/schemas/Summary'
        shippingAddress:
          $ref: '#/components/schemas/AddressInput'
        paymentStatus:
          type: string
        refundStatus:
          type: string
        placedAt:
          type: string
          format: date-time
      required:
      - id
      - status
      - items
      - summary
    PaymentSession:
      type: object
      properties:
        gatewayOrderId:
          type: string
        amount: *id001
        currency:
          type: string
        clientConfig:
          type: object
          description: Provider-specific values the gateway form needs; never secrets
      required:
      - gatewayOrderId
      - amount
      - currency
    CheckoutResult:
      type: object
      properties:
        order:
          $ref: '#/components/schemas/Order'
        payment:
          $ref: '#/components/schemas/PaymentSession'
      required:
      - order
      - payment
    SellerApplication:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/ObjectId'
        userId:
          $ref: '#/components/schemas/ObjectId'
        storeName:
          type: string
        description:
          type: string
        status:
          type: string
          enum:
          - pending
          - approved
          - rejected
        rejectionReason:
          type: string
      required:
      - id
      - storeName
      - status
    ImageRef:
      type: object
      properties:
        imageId:
          $ref: '#/components/schemas/ObjectId'
        url:
          type: string
      required:
      - imageId
      - url
    SalesReport:
      type: object
      properties:
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        orderCount:
          type: integer
        unitsSold:
          type: integer
        revenue: *id001
        byBook:
          type: array
          items:
            type: object
            properties:
              bookId:
                $ref: '#/components/schemas/ObjectId'
              title:
                type: string
              units:
                type: integer
              revenue: *id001
    PlatformReport:
      type: object
      properties:
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        orderCount:
          type: integer
        revenue: *id001
        topBooks:
          type: array
          maxItems: 10
          items:
            type: object
            properties:
              bookId:
                $ref: '#/components/schemas/ObjectId'
              title:
                type: string
              units:
                type: integer
    Notification:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/ObjectId'
        type:
          type: string
        subject:
          type: string
        payload:
          type: object
        readAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
    Health:
      type: object
      properties:
        status:
          type: string
          enum:
          - ok
        db:
          type: string
          enum:
          - up
          - down
        uptimeSeconds:
          type: integer
        time:
          type: string
          format: date-time
      required:
      - status
      - db
    BookPage:
      allOf:
      - $ref: '#/components/schemas/Page'
      - type: object
        properties:
          items:
            type: array
            items:
              $ref: '#/components/schemas/Book'
    ReviewPage:
      allOf:
      - $ref: '#/components/schemas/Page'
      - type: object
        properties:
          items:
            type: array
            items:
              $ref: '#/components/schemas/Review'
    OrderPage:
      allOf:
      - $ref: '#/components/schemas/Page'
      - type: object
        properties:
          items:
            type: array
            items:
              $ref: '#/components/schemas/Order'
    ApplicationPage:
      allOf:
      - $ref: '#/components/schemas/Page'
      - type: object
        properties:
          items:
            type: array
            items:
              $ref: '#/components/schemas/SellerApplication'
    NotificationPage:
      allOf:
      - $ref: '#/components/schemas/Page'
      - type: object
        properties:
          items:
            type: array
            items:
              $ref: '#/components/schemas/Notification'
    UserPage:
      allOf:
      - $ref: '#/components/schemas/Page'
      - type: object
        properties:
          items:
            type: array
            items:
              $ref: '#/components/schemas/User'
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: session
      description: HttpOnly, Secure, SameSite=Lax cookie holding a signed token that expires after 60 minutes
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
    gatewaySignature:
      type: apiKey
      in: header
      name: X-Gateway-Signature
