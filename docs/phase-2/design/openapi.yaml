openapi: 3.0.3
info:
  title: Online Bookstore REST API
  version: 1.0.0
  description: Phase 2 API definition. Money values are integers in minor currency units. Dates are ISO 8601 UTC.
    Every error uses the Error schema. State-changing requests need the X-CSRF-Token header obtained from GET /api/auth/csrf-token,
    except the payment webhook.
servers:
- url: /
  description: Same origin as the web application (host TBD)
tags:
- name: Authentication and platform
- name: Profile and addresses
- name: Catalog, categories and images
- name: Cart
- name: Wishlist
- name: Orders and payment
- name: Reviews
- name: Seller
- name: Notifications
- name: Administrator
- name: System
paths:
  /api/auth/csrf-token:
    get:
      operationId: api_01
      summary: Issue a CSRF token
      tags:
      - Authentication and platform
      description: 'API-01. Requirements: VFR-06. Use cases: UC-04, UC-05, UC-14. Access: None. Validation: None.'
      security: []
      responses:
        '200':
          description: '{ csrfToken } and sets the CSRF cookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfToken'
  /api/auth/register:
    post:
      operationId: api_02
      summary: Register a customer account
      tags:
      - Authentication and platform
      description: 'API-02. Requirements: FR-01, VFR-04. Use cases: UC-04, UC-25. Access: None. Validation: name
        1-100 chars; email valid, stored lower-case; password 8-72 chars.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 100
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
                  maxLength: 72
              required:
              - name
              - email
              - password
      security:
      - csrfToken: []
      responses:
        '201':
          description: '{ message } (verification email queued)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '400':
          description: 'VALIDATION_ERROR: Request body, query or path parameter fails validation'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: 'EMAIL_TAKEN: Email already registered'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: 'RATE_LIMITED: Too many requests from this client'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: 'CSRF_INVALID: missing or wrong CSRF token'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/auth/verify-email:
    post:
      operationId: api_03
      summary: Verify email address
      tags:
      - Authentication and platform
      description: 'API-03. Requirements: FR-01. Use cases: UC-04. Access: None. Validation: token is a 32-128 character
        string.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                  minLength: 32
                  maxLength: 128
              required:
              - token
      security:
      - csrfToken: []
      responses:
        '200':
          description: '{ message }; account becomes active'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '400':
          description: 'VALIDATION_ERROR: Request body, query or path parameter fails validation; TOKEN_INVALID_OR_EXPIRED:
            Token unknown, expired or already used'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: 'CSRF_INVALID: missing or wrong CSRF token'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/auth/resend-verification:
    post:
      operationId: api_04
      summary: Resend verification email
      tags:
      - Authentication and platform
      description: 'API-04. Requirements: FR-01. Use cases: UC-04, UC-25. Access: None. Validation: email valid.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
              required:
              - email
      security:
      - csrfToken: []
      responses:
        '200':
          description: '{ message }; always the same text so existing emails are not revealed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '400':
          description: 'VALIDATION_ERROR: Request body, query or path parameter fails validation'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: 'RATE_LIMITED: Too many requests from this client'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: 'CSRF_INVALID: missing or wrong CSRF token'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/auth/login:
    post:
      operationId: api_05
      summary: Log in
      tags:
      - Authentication and platform
      description: 'API-05. Requirements: FR-02, FR-24, VFR-07. Use cases: UC-05. Access: None. Validation: email
        valid; password present.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 1
                  maxLength: 72
              required:
              - email
              - password
      security:
      - csrfToken: []
      responses:
        '200':
          description: User object; session cookie set (HttpOnly, Secure, SameSite=Lax, 60 minutes)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: 'VALIDATION_ERROR: Request body, query or path parameter fails validation'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: 'INVALID_CREDENTIALS: Email or password wrong (same response for both)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: 'EMAIL_NOT_VERIFIED: Email not yet verified (login requires verification: design assumption
            A-02); ACCOUNT_SUSPENDED: Account suspended by an administrator'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '423':
          description: 'ACCOUNT_LOCKED: 5 consecutive failures; locked for 15 minutes; Retry-After header set'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: 'RATE_LIMITED: Too many requests from this client'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/auth/logout:
    post:
      operationId: api_06
      summary: Log out
      tags:
      - Authentication and platform
      description: 'API-06. Requirements: FR-02. Use cases: UC-05. Access: Customer, Seller or Administrator. Validation:
        None.'
      security:
      - sessionCookie: []
        csrfToken: []
      responses:
        '200':
          description: '{ message }; cookie cleared; token version incremented'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '401':
          description: 'UNAUTHENTICATED: No valid session'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: 'CSRF_INVALID: missing or wrong CSRF token'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/auth/me:
    get:
      operationId: api_07
      summary: Get current user
      tags:
      - Authentication and platform
      description: 'API-07. Requirements: FR-02, FR-29. Use cases: UC-05. Access: Customer, Seller or Administrator.
        Validation: None.'
      security:
      - sessionCookie: []
      responses:
        '200':
          description: Current user (id, name, email, roles, status)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: 'UNAUTHENTICATED: No valid session'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/auth/forgot-password:
    post:
      operationId: api_08
      summary: Request password reset email
      tags:
      - Authentication and platform
      description: 'API-08. Requirements: FR-03. Use cases: UC-14, UC-25. Access: None. Validation: email valid.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
              required:
              - email
      security:
      - csrfToken: []
      responses:
        '200':
          description: '{ message }; always the same text'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '400':
          description: 'VALIDATION_ERROR: Request body, query or path parameter fails validation'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: 'RATE_LIMITED: Too many requests from this client'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: 'CSRF_INVALID: missing or wrong CSRF token'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/auth/reset-password:
    post:
      operationId: api_09
      summary: Reset password
      tags:
      - Authentication and platform
      description: 'API-09. Requirements: FR-03, VFR-04. Use cases: UC-14. Access: None. Validation: newPassword
        8-72 chars; token 32-128 chars.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                  minLength: 32
                  maxLength: 128
                newPassword:
                  type: string
                  minLength: 8
                  maxLength: 72
              required:
              - token
              - newPassword
      security:
      - csrfToken: []
      responses:
        '200':
          description: '{ message }; token consumed; all sessions invalidated'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '400':
          description: 'VALIDATION_ERROR: Request body, query or path parameter fails validation; TOKEN_INVALID_OR_EXPIRED:
            Token unknown, expired (30 minutes) or already used'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: 'CSRF_INVALID: missing or wrong CSRF token'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/profile:
    get:
      operationId: api_10
      summary: Get own profile and addresses
      tags:
      - Profile and addresses
      description: 'API-10. Requirements: FR-18. Use cases: UC-13. Access: Customer. Validation: None.'
      security:
      - sessionCookie: []
      responses:
        '200':
          description: Profile with name, email, phone and addresses
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '401':
          description: 'UNAUTHENTICATED: No session'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: 'FORBIDDEN: role not allowed, or CSRF_INVALID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    patch:
      operationId: api_11
      summary: Update profile
      tags:
      - Profile and addresses
      description: 'API-11. Requirements: FR-18. Use cases: UC-13. Access: Customer. Validation: name 1-100 chars;
        phone 7-15 digits; email cannot be changed.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 100
                phone:
                  type: string
                  minLength: 7
                  maxLength: 15
      security:
      - sessionCookie: []
        csrfToken: []
      responses:
        '200':
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '400':
          description: 'VALIDATION_ERROR: Request body, query or path parameter fails validation'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: 'UNAUTHENTICATED: no valid session'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: 'FORBIDDEN: role not allowed, or CSRF_INVALID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/profile/addresses:
    post:
      operationId: api_12
      summary: Add a saved address
      tags:
      - Profile and addresses
      description: 'API-12. Requirements: FR-18, FR-11. Use cases: UC-13, UC-08. Access: Customer. Validation: fullName,
        line1, city, state, postalCode, country, phone required; maximum 5 addresses per user.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                label:
                  type: string
                  minLength: 0
                  maxLength: 30
                fullName:
                  type: string
                  minLength: 1
                  maxLength: 100
                line1:
                  type: string
                  minLength: 1
                  maxLength: 150
                line2:
                  type: string
                  minLength: 0
                  maxLength: 150
                city:
                  type: string
                  minLength: 1
                  maxLength: 80
                state:
                  type: string
                  minLength: 1
                  maxLength: 80
                postalCode:
                  type: string
                  minLength: 3
                  maxLength: 12
                country:
                  type: string
                  minLength: 2
                  maxLength: 60
                phone:
                  type: string
                  minLength: 7
                  maxLength: 15
                isDefault:
                  type: boolean
              required:
              - fullName
              - line1
              - city
              - state
              - postalCode
              - country
              - phone
      security:
      - sessionCookie: []
        csrfToken: []
      responses:
        '201':
          description: Created address with id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Address'
        '400':
          description: 'VALIDATION_ERROR: Request body, query or path parameter fails validation'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: 'ADDRESS_LIMIT: Already 5 saved addresses'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: 'UNAUTHENTICATED: no valid session'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: 'FORBIDDEN: role not allowed, or CSRF_INVALID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/profile/addresses/{addressId}:
    patch:
      operationId: api_13
      summary: Update a saved address
      tags:
      - Profile and addresses
      description: 'API-13. Requirements: FR-18. Use cases: UC-13. Access: Customer. Validation: Same field rules
        as creation, all optional.'
      parameters:
      - name: addressId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/ObjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                label:
                  type: string
                  minLength: 0
                  maxLength: 30
                fullName:
                  type: string
                  minLength: 1
                  maxLength: 100
                line1:
                  type: string
                  minLength: 1
                  maxLength: 150
                line2:
                  type: string
                  minLength: 0
                  maxLength: 150
                city:
                  type: string
                  minLength: 1
                  maxLength: 80
                state:
                  type: string
                  minLength: 1
                  maxLength: 80
                postalCode:
                  type: string
                  minLength: 3
                  maxLength: 12
                country:
                  type: string
                  minLength: 2
                  maxLength: 60
                phone:
                  type: string
                  minLength: 7
                  maxLength: 15
                isDefault:
                  type: boolean
      security:
      - sessionCookie: []
        csrfToken: []
      responses:
        '200':
          description: Updated address
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Address'
        '400':
          description: 'VALIDATION_ERROR: Request body, query or path parameter fails validation'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 'NOT_FOUND: Resource does not exist or is not visible to the caller'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: 'UNAUTHENTICATED: no valid session'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: 'FORBIDDEN: role not allowed, or CSRF_INVALID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      operationId: api_14
      summary: Delete a saved address
      tags:
      - Profile and addresses
      description: 'API-14. Requirements: FR-18. Use cases: UC-13. Access: Customer. Validation: None.'
      parameters:
      - name: addressId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/ObjectId'
      security:
      - sessionCookie: []
        csrfToken: []
      responses:
        '204':
          description: No content
        '404':
          description: 'NOT_FOUND: Resource does not exist or is not visible to the caller'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: 'UNAUTHENTICATED: no valid session'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: 'FORBIDDEN: role not allowed, or CSRF_INVALID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/books:
    get:
      operationId: api_15
      summary: Browse, search, filter and sort books
      tags:
      - Catalog, categories and images
      description: 'API-15. Requirements: FR-04, FR-05, FR-06, VFR-01, VFR-02. Use cases: UC-01, UC-02. Access:
        None. Validation: page >= 1; q 1-100 chars, lower-cased and accent-stripped, matched as a substring of title,
        author and ISBN through the indexed search fields; price bounds are non-negative integers (minor units);
        rating 1-5.'
      parameters:
      - name: q
        in: query
        required: false
        schema:
          type: string
          minLength: 1
          maxLength: 100
      - name: category
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/ObjectId'
      - name: minPrice
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
      - name: maxPrice
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
      - name: minRating
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 5
      - name: language
        in: query
        required: false
        schema:
          type: string
          minLength: 2
          maxLength: 30
      - name: sort
        in: query
        required: false
        schema:
          type: string
          enum:
          - newest
          - price_asc
          - price_desc
          - rating_desc
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
      security: []
      responses:
        '200':
          description: '{ items[20 max], page, pageSize: 20, totalItems, totalPages }; only approved listings'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookPage'
        '400':
          description: 'VALIDATION_ERROR: Request body, query or path parameter fails validation'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/books/{bookId}:
    get:
      operationId: api_16
      summary: Get book details
      tags:
      - Catalog, categories and images
      description: 'API-16. Requirements: FR-07, VFR-01. Use cases: UC-03. Access: None. Validation: bookId is a
        24-character hex id.'
      parameters:
      - name: bookId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/ObjectId'
      security: []
      responses:
        '200':
          description: Book with title, author, ISBN, price, description, image URLs, stock status, average rating
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
        '404':
          description: 'NOT_FOUND: Resource does not exist or is not visible to the caller'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/books/{bookId}/reviews:
    get:
      operationId: api_17
      summary: List reviews of a book
      tags:
      - Catalog, categories and images
      description: 'API-17. Requirements: FR-07, FR-17. Use cases: UC-03, UC-12. Access: None. Validation: page
        >= 1.'
      parameters:
      - name: bookId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/ObjectId'
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
      security: []
      responses:
        '200':
          description: '{ items, page, totalItems, totalPages } newest first, 10 per page'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewPage'
        '400':
          description: 'VALIDATION_ERROR: Request body, query or path parameter fails validation'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 'NOT_FOUND: Resource does not exist or is not visible to the caller'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      operationId: api_33
      summary: Rate and review a book
      tags:
      - Reviews
      description: 'API-33. Requirements: FR-17. Use cases: UC-12. Access: Customer. Validation: rating integer
        1-5; comment 0-2000 chars, stored as text and escaped on display.'
      parameters:
      - name: bookId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/ObjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                rating:
                  type: integer
                  minimum: 1
                  maximum: 5
                comment:
                  type: string
                  minLength: 0
                  maxLength: 2000
              required:
              - rating
      security:
      - sessionCookie: []
        csrfToken: []
      responses:
        '201':
          description: Created review; book average rating updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Review'
        '400':
          description: 'VALIDATION_ERROR: Request body, query or path parameter fails validation'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 'NOT_FOUND: Resource does not exist or is not visible to the caller'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: 'NOT_ELIGIBLE: Customer has no delivered order containing this book'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: 'ALREADY_REVIEWED: One review per customer per book'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: 'UNAUTHENTICATED: no valid session'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/categories:
    get:
      operationId: api_18
      summary: List categories
      tags:
      - Catalog, categories and images
      description: 'API-18. Requirements: FR-06, FR-26. Use cases: UC-02, UC-23. Access: None. Validation: None.'
      security: []
      responses:
        '200':
          description: Array of { id, name }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryList'
  /api/images/{imageId}:
    get:
      operationId: api_19
      summary: Get a book image
      tags:
      - Catalog, categories and images
      description: 'API-19. Requirements: FR-07, FR-20. Use cases: UC-03, UC-16. Access: None. Validation: imageId
        is a 24-character hex id.'
      parameters:
      - name: imageId
        in: path
        required: true
        schema:
