    post:
      operationId: api_28
      summary: Confirm payment and place the order
      tags:
      - Orders and payment
      description: 'API-28. Requirements: FR-13, FR-14, FR-30, VFR-08, VFR-14. Use cases: UC-08, UC-09, UC-25. Access:
        Customer. Validation: gatewayPaymentId present; order belongs to caller and is PendingPayment or already
        Placed.'
      parameters:
      - name: orderId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/ObjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                gatewayPaymentId:
                  type: string
                  minLength: 1
                  maxLength: 100
                gatewaySignature:
                  type: string
                  minLength: 0
                  maxLength: 256
              required:
              - gatewayPaymentId
      security:
      - sessionCookie: []
        csrfToken: []
      responses:
        '200':
          description: Order with status Placed; the reservation is finalised (stock decremented); calling again
            returns the same confirmed order (idempotent)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          description: 'VALIDATION_ERROR: Request body, query or path parameter fails validation; PAYMENT_VERIFICATION_FAILED:
            Gateway does not confirm the payment; the reservation is kept until it expires or the order is cancelled'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 'NOT_FOUND: Resource does not exist or is not visible to the caller'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: 'ORDER_NOT_PAYABLE: Order was cancelled or has already failed and cannot be paid; ORDER_FAILED_REFUNDED:
            Reservation had expired and the stock could not be reserved again; order failed and payment refunded'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: 'PAYMENT_GATEWAY_ERROR: Gateway unreachable'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: 'UNAUTHENTICATED: no valid session'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: 'FORBIDDEN: role not allowed, or CSRF_INVALID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
