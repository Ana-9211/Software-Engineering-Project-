# Render blueprint for the Online Bookstore (free web service + a MongoDB Atlas free cluster).
# Secrets are never stored here: the values marked sync: false are entered once in the Render dashboard.
services:
  - type: web
    name: online-bookstore
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI          # mongodb+srv://... (Atlas replica set; transactions need a replica set)
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CSRF_SECRET
        generateValue: true
      - key: PAYMENT_PROVIDER     # fake = the test gateway; there is no real provider yet
        value: fake
      - key: PAYMENT_WEBHOOK_SECRET
        generateValue: true
      - key: MAIL_PROVIDER        # console = emails are printed to the service log, nothing is delivered
        value: console
      - key: APP_BASE_URL         # the public https:// address of the service
        sync: false
      - key: RATE_LIMIT_GLOBAL
        value: "300"
      - key: RATE_LIMIT_AUTH
        value: "20"
