name: CI

on:
  push:
    branches: [main, phase-1-requirements]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Server tests
        run: npm test
      - name: Client tests
        run: npm run test:client
      - name: Client build
        run: npm run build
      - name: OpenAPI contract is valid
        run: node server/scripts/validate-openapi.mjs
      - name: Runtime dependency audit (high and critical)
        run: npm audit --omit=dev --audit-level=high
